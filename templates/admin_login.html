<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin sign in · Astrium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
  </head>
  <body class="admin-body admin-body--login">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand login-brand">
          <span class="brand-mark">A</span>
          <span>Astrium</span>
        </div>

        <p class="eyebrow eyebrow-dark">Staff access</p>
        <h1 id="login-title">Admin sign in</h1>
        <p class="login-sub">
          Check-in records are private. Sign in with your staff account to view
          the guest dashboard.
        </p>

        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form class="login-form" method="post" action="{{ url_for('admin_login') }}">
          <div class="field">
            <label for="admin-username">Username</label>
            <input
              id="admin-username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus
            />
          </div>

          <div class="field">
            <label for="admin-password">Password</label>
            <input
              id="admin-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>

        <p class="login-foot">
          <a href="{{ url_for('home') }}">&larr; Back to website</a>
        </p>
      </section>
    </main>
  </body>
</html>
